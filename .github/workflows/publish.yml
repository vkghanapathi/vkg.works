name: Publish vkg.works

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "templates/**"
      - "assets/**"
      - "scripts/**"
  workflow_dispatch:   # Allow manual trigger for testing

# Prevent concurrent deploys — queue, never cancel
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Test, Build, Deploy, Announce
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to commit state files back

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # ── INTAKE: AI-powered batch import from inbox ─────────────────────────
      # Looks for section-named ZIPs: books.zip, articles.zip, poems.zip, etc.
      # Calls Claude to infer title, language, subject, abstract, keywords.
      # Outputs .md sidecars with full metadata → status: draft → appears in /queue/
      - name: Intake ZIP files from content/inbox (if any)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping AI intake."
            exit 0
          fi
          shopt -s nullglob
          zips=(content/inbox/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ZIPs in content/inbox/ — skipping intake."
            exit 0
          fi
          git config user.name "vkg-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for zip in "${zips[@]}"; do
            basename="${zip##*/}"      # e.g. books.zip
            section="${basename%.zip}" # e.g. books
            valid_sections="articles poems songs books audio video projects coverage"
            if echo "$valid_sections" | grep -qw "$section"; then
              echo "── Intaking $basename → section: $section"
              python scripts/intake.py --zip "$zip" --section "$section"
            else
              echo "WARN: $basename — filename must match a section name (e.g. books.zip). Skipping."
            fi
            # Move processed ZIP out of inbox so it doesn't re-run
            mv "$zip" "content/inbox/processed-$(date +%Y%m%d-%H%M%S)-$basename"
          done
          git add content/ state/registry.json
          git diff --staged --quiet || (git commit -m "chore: intake batch from inbox [skip ci]" && git push)

      # ── TEST GATE ──────────────────────────────────────────────────────────
      - name: Run build validation tests
        run: python scripts/test_build.py
        # This step builds the site AND validates output.
        # If any check fails, the workflow stops here — nothing is deployed.

      # ── DEPLOY ────────────────────────────────────────────────────────────
      # Re-run build with social flag (test already ran dry-run build above)
      - name: Build site with social flag
        run: python scripts/build.py --site-url "https://vkg.works" --social
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_RECIPIENT_LIST: ${{ secrets.WHATSAPP_RECIPIENT_LIST }}

      - name: Deploy to cPanel via FTP
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          local-dir: ./site/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.DS_Store
            **/Thumbs.db

      # ── STATE COMMIT ──────────────────────────────────────────────────────
      - name: Commit updated state (registry + social posts)
        run: |
          git config user.name "vkg-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json state/registry.json
          git diff --staged --quiet || git commit -m "chore: update state [skip ci]"
          git push
